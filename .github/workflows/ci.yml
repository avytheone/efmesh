name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Missing integration prerequisites are errors, never a green skip.
      - name: Postgres on PATH
        run: |
          for pg_bin in /usr/lib/postgresql/*/bin; do
            if [ -x "$pg_bin/initdb" ] && [ -x "$pg_bin/pg_ctl" ]; then
              echo "$pg_bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::PostgreSQL initdb/pg_ctl are required for CI integration tests"
          exit 1

      - name: Integration prerequisites
        run: |
          docker info > /dev/null
          initdb --version
          pg_ctl --version

      # Lint + format check (biome) and types (tsc), same `check` script as local
      - name: Check
        run: bun run check

      - name: Tests
        run: bun test
